<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목적지 선택</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/destination.css') }}">
</head>

<body>
    <div class="app-page">
        <div class="screen">

            <header class="top-bar">
                
                <div class="top-action"></div>

                <img
                    class="page-logo"
                    src="{{url_for('static', filename='img/ui/logo.png')}}"
                    alt="AIRPORT GUIDE ROBOT"
                >

                <div class="top-action"></div>
            </header>

            <main class="destination-page">

                <section class="title-area">
                    <h1 class="page-title">목적지를 선택해주세요</h1>
                    <p class="page-desc">
                        여러 곳을 선택할 수 있으며, 선택한 순서대로 안내합니다.
                    </p>
                </section>

                <section class="destination-layout">

                    <div class="destination-card card">
                        <div class="card-header">
                            <h2>전체 목적지</h2>
                            <span class="card-caption">원하는 목적지를 추가하세요.</span>
                        </div>

                        <div class="search-box">
                            <input
                                type="text"
                                id="destinationSearch"
                                placeholder="목적지 검색"
                            >
                        </div>

                        <ul id="placeList" class="place-list"></ul>
                    </div>

                    <div class="destination-card card">
                        <div class="card-header">
                            <h2>선택한 목적지</h2>
                            <span class="card-caption">순서대로 안내됩니다.</span>
                        </div>

                        <ol id="selectedList" class="selected-list"></ol>

                        <p class="limit-text">
                            최대 5개까지만 이용 부탁드립니다.
                        </p>

                        <button
                            class="primary-btn start-btn"
                            type="button"
                            onclick="startNavigation()"
                        >
                            안내 시작하기
                            <span>→</span>
                        </button>
                    </div>

                </section>

            </main>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/destination.js') }}"></script>
</body>
</html>
