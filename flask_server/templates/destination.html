<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길 안내 목적지 설정</title>

    <link rel="icon" href="data:,">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; padding: 20px; background-color: #f5f5f5; }
        h1 { margin-bottom: 20px; font-size: 24px; color: #333; }
        
        /* 좌우 레이아웃 분할 */
        .container { display: flex; flex: 1; gap: 20px; min-height: 0; }
        .panel { flex: 1; background: white; border-radius: 8px; border: 1px solid #ddd; padding: 20px; display: flex; flex-direction: column; }
        .panel h2 { font-size: 18px; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #eee; color: #555; }
        
        /* 리스트 스타일 */
        .list-container { flex: 1; overflow-y: auto; list-style: none; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .item:hover { background: #f0f0f0; }
        
        /* 오른쪽 선택된 장소 컴포넌트 */
        .selected-item { cursor: default; background: #eef5ff; border-color: #bcd6ff; }
        .selected-item:hover { background: #eef5ff; }
        .btn-group { display: flex; gap: 5px; }
        
        /* 버튼 스타일 */
        button { padding: 6px 12px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer; font-size: 12px; }
        button:hover { background: #eee; }
        .btn-add { background: #4caf50; color: white; border: none; font-weight: bold; }
        .btn-add:hover { background: #45a049; }
        .btn-delete { background: #f44336; color: white; border: none; }
        .btn-delete:hover { background: #da190b; }
        
        /* 하단 액션 바 */
        .action-bar { margin-top: 20px; display: flex; justify-content: flex-end; }
        .btn-start { padding: 15px 30px; font-size: 16px; font-weight: bold; background: #2196f3; color: white; border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-start:hover { background: #0b7dda; }
    </style>
</head>
<body>

    <h1>📍 로봇 경유지 지정 시스템</h1>

    <div class="container">
        <div class="panel">
            <h2>전체 장소 목록</h2>
            <ul id="placeList" class="list-container"></ul>
        </div>

        <div class="panel">
            <h2>설정된 경로 (순서)</h2>
            <ol id="selectedList" class="list-container"></ol>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn-start" onclick="startNavigation()">🚀 길안내 시작</button>
    </div>
    <script src="{{ url_for('static', filename='js/destination.js') }}"></script>
</body>
</html>
</html>
