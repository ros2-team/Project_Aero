<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내 확인</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/welcome.css') }}">
</head>

<body>
    <div class="welcome-page">

        <div class="background-layer"></div>
        <div class="white-gradient-layer"></div>

        <header class="welcome-header">

            <div class="header-empty"></div>

            <img
                class="logo-image"
                src="{{ url_for('static', filename='img/ui/logo.png') }}"
                alt="AIRPORT GUIDE ROBOT"
            >

            <div class="header-empty"></div>

        </header>

        <main class="welcome-content">

            <section class="welcome-main">

                <h1>
                    안내가 필요하신가요?
                </h1>

                <p>
                    필요하시면 아래 버튼을 눌러주세요.
                </p>

                <div class="choice-area">

                    <button
                        class="choice-button primary-choice"
                        onclick="location.href='/destination'"
                    >
                        <div class="choice-icon">✈</div>
                        <span>예, 안내가 필요해요</span>
                    </button>

                    <button
                        class="choice-button secondary-choice"
                        onclick="location.href='/idle'"
                    >
                        <div class="choice-icon">×</div>
                        <span>아니요, 괜찮아요</span>
                    </button>

                </div>

                <div class="notice-box">
                    <div class="notice-icon">i</div>
                    <span>
                        원하시는 목적지로 안전하게 안내해 드릴게요.
                    </span>
                </div>

            </section>

        </main>

    </div>
</body>
</html>
