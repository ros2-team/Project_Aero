<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇 호출</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/qrcall.css') }}">
</head>

<body>
    <div class="app-page">
        <div class="screen">

            <header class="top-bar">
                <div class="top-action"></div>

                <div class="brand">
                    <span class="brand-icon">🤖</span>
                    <span>AIRPORT GUIDE ROBOT</span>
                </div>

                <div class="top-action"></div>
            </header>

            <main class="qrcall-page">

                <section class="qrcall-card card">

                    <div class="call-icon">
                        📱
                    </div>

                    <span class="call-badge">
                        QR 호출
                    </span>

                    <h1>
                        로봇을 호출하시겠습니까?
                    </h1>

                    <p>
                        현재 위치로 안내 로봇을 호출합니다.<br>
                        로봇이 도착하면 화면에서 목적지를 선택할 수 있습니다.
                    </p>

                    <div class="location-box">
                        <div class="location-label">현재 호출 위치</div>
                        <div class="location-value" id="locationValue">
                            {{ location }}
                        </div>
                    </div>

                    <button
                        class="primary-btn call-btn"
                        id="callRobotButton"
                        data-location="{{ location }}"
                    >
                        로봇 호출하기
                    </button>

                    <button
                        class="secondary-btn back-btn"
                        onclick="history.back()"
                    >
                        이전 화면
                    </button>

                    <div class="call-result" id="callResult">
                        호출 대기 중입니다.
                    </div>

                </section>

            </main>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/qrcall.js') }}"></script>
</body>
</html>
