<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Airport Guide Robot</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+KR:wght@400;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home_page.css') }}">
    <script src="{{ url_for('static', filename='js/home_page.js') }}" defer></script>
</head>
<body>
    <div class="airport_home_container">
        
        <header class="airport_home_header">
            <div class="airport_home_brand">
                <i class="fa-solid fa-plane-departure airport_home_cyan_txt"></i>
                <span class="airport_home_lang_text" id="airport_home_brand_txt">AIRPORT GUIDE ROBOT</span>
            </div>
            <div class="airport_home_clock" id="airport_home_live_clock">00:00:00</div>
        </header>

        <main class="airport_home_main">
            <div class="airport_home_visual">
                <div class="airport_home_icon_wrapper">
                    <i class="fa-solid fa-map-location-dot airport_home_center_icon"></i>
                </div>
                <h1 class="airport_home_prompt_main airport_home_lang_text" id="airport_home_prompt_1">길을 찾고 계신가요?</h1>
                <p class="airport_home_prompt_sub airport_home_lang_text" id="airport_home_prompt_2">원하는 장소까지 안내해 드립니다.</p>
            </div>

            <button class="airport_home_cta_btn" id="airport_home_btn_start" data-url="{{ url_for('home.temp_guide_index') }}">
                <i class="fa-solid fa-route" style="margin-right:15px;"></i> 
                <span class="airport_home_lang_text" id="airport_home_btn_txt">길안내 시작</span>
            </button>
        </main>

        <footer class="airport_home_footer">
            <button class="airport_home_voice_btn" id="airport_home_btn_voice">
                <i class="fa-solid fa-volume-high"></i>
                <span class="airport_home_lang_text" id="airport_home_voice_txt">음성 안내</span>
            </button>

            <div class="airport_home_lang_selector">
                <button class="airport_home_lang_btn" data-lang="ko">한국어</button>
                <button class="airport_home_lang_btn" data-lang="en">English</button>
                <button class="airport_home_lang_btn" data-lang="ja">日本語</button>
                <button class="airport_home_lang_btn" data-lang="zh">中文</button>
            </div>
        </footer>
    </div>
</body>
</html>
