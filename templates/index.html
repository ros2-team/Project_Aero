<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airport Guide Robot</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+KR:wght@400;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="kiosk-container">
        
        <header class="kiosk-header">
            <div class="brand-logo">
                <i class="fa-solid fa-plane-departure text-cyan"></i>
                <span class="brand-text lang-fade" data-lang-key="brand">AIRPORT GUIDE ROBOT</span>
            </div>
            <div class="current-time" id="live-clock">00:00:00</div>
        </header>

        <main class="kiosk-main">
            <div class="info-visual">
                <div class="icon-pulse-wrapper">
                    <i class="fa-solid fa-map-location-dot main-guide-icon"></i>
                </div>
                <h1 class="main-prompt lang-fade" data-lang-key="main_prompt">길을 찾고 계신가요?</h1>
                <p class="sub-prompt lang-fade" data-lang-key="sub_prompt">원하는 장소까지 안내해 드립니다.</p>
            </div>

            <button class="cta-button" id="btn-start-guide">
                <i class="fa-solid fa-route icon-spacing"></i> 
                <span class="lang-fade" data-lang-key="start_guide">길안내 시작</span>
            </button>
        </main>

        <footer class="kiosk-footer">
            <button class="voice-assist-btn" id="btn-voice-toggle">
                <i class="fa-solid fa-volume-high"></i>
                <span class="lang-fade" id="txt-voice-assist" data-lang-key="voice_off">음성 안내</span>
            </button>

            <div class="language-selector">
                <button class="lang-btn active" data-lang="ko">한국어</button>
                <button class="lang-btn" data-lang="en">English</button>
                <button class="lang-btn" data-lang="ja">日本語</button>
                <button class="lang-btn" data-lang="zh">中文</button>
            </div>
        </footer>
        
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
